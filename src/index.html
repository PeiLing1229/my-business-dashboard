<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Data, code and styles are part of this page. The only address it may connect to is Google's Gemini API,
     used only when the viewer presses "Analyse with Gemini" with their own key (src/briefs/gemini.js). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://generativelanguage.googleapis.com; font-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>业务仪表盘 · Business dashboard</title>
<meta name="theme-color" content="#EEF2F7">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/team1-racing-dog-logo.png" type="image/png">
</head>
<body>
<noscript><p class="notice">这个演示需要开启 JavaScript。This demo needs JavaScript enabled.</p></noscript>

<div id="ribbon" class="ribbon" role="note"></div>
<div id="shell" class="shell">
  <header class="topbar">
    <button id="menu-toggle" class="icon-btn" aria-label="Menu" aria-expanded="false" aria-controls="nav">☰</button>
    <div class="brand"><img class="brand-logo" src="assets/team1-racing-dog-logo.png" alt=""><span id="business-name">我的 Excel</span></div>
    <div class="topbar-right">
      <label class="lang"><span>语言 · Language</span>
        <select id="lang-select"><option value="zh-CN">中文</option><option value="en">English</option></select>
      </label>
    </div>
  </header>
  <div class="layout">
    <nav id="nav" class="sidenav" aria-label="Sections"></nav>
    <main id="main" class="main" tabindex="-1">
      <div id="scenario-bar" class="scenario-bar"></div>
      <div id="banner" class="banner" hidden></div>
      <div id="page"></div>
    </main>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="modal-root"></div>

<script type="module" src="main.js"></script>
</body>
</html>
